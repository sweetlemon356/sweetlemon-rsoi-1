name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: classroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t person-service:${{ github.sha }} .

  unit_tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: Run unit tests and static checks
        run: make check

  deploy:
    name: Deploy
    needs: unit_tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render through REST API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          : "${RENDER_API_KEY:?GitHub secret RENDER_API_KEY is required}"
          : "${RENDER_SERVICE_ID:?GitHub secret RENDER_SERVICE_ID is required}"

          EXISTING_DEPLOYS=$(curl --fail-with-body --show-error --silent \
            --get \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --data-urlencode 'limit=100' \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY")
          EXISTING_IDS=$(jq -c '[.[].deploy.id]' <<< "$EXISTING_DEPLOYS")
          DEPLOY_REQUESTED_AT=$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          DEPLOY_HTTP_STATUS=$(curl --fail-with-body --show-error --silent \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg commit_id "$GITHUB_SHA" '{commitId: $commit_id}')" \
            --output "$RUNNER_TEMP/render-deploy.json" \
            --write-out '%{http_code}')
          case "$DEPLOY_HTTP_STATUS" in
            201|202) ;;
            *) echo "Unexpected Render deploy response: HTTP $DEPLOY_HTTP_STATUS" >&2; exit 1 ;;
          esac

          DEPLOY_ID=$(jq -r '.id // empty' "$RUNNER_TEMP/render-deploy.json")
          if [ -z "$DEPLOY_ID" ]; then
            # Queued (202) responses can omit the deploy object; find this exact commit.
            for attempt in $(seq 1 180); do
              DEPLOYS=$(curl --fail-with-body --show-error --silent \
                --get \
                --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
                --data-urlencode "createdAfter=$DEPLOY_REQUESTED_AT" \
                --data-urlencode 'limit=100' \
                --header "Accept: application/json" \
                --header "Authorization: Bearer $RENDER_API_KEY")
              DEPLOY_ID=$(jq -r --arg sha "$GITHUB_SHA" --argjson existing "$EXISTING_IDS" \
                '[.[] | .deploy as $deploy | select($deploy.commit.id == $sha and $deploy.trigger == "api" and ($existing | index($deploy.id) == null)) | $deploy.id] | unique | if length == 1 then .[0] else empty end' \
                <<< "$DEPLOYS")
              if [ -n "$DEPLOY_ID" ]; then
                break
              fi
              sleep 5
            done
          fi
          : "${DEPLOY_ID:?Render did not return a deploy ID for this commit}"

          for attempt in $(seq 1 180); do
            DEPLOY_RESPONSE=$(curl --fail-with-body --show-error --silent \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer $RENDER_API_KEY")
            DEPLOY_STATUS=$(jq --exit-status --raw-output '.status' <<< "$DEPLOY_RESPONSE")
            echo "Render deploy $DEPLOY_ID status: $DEPLOY_STATUS"

            case "$DEPLOY_STATUS" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                sleep 5
                ;;
              *)
                echo "Unknown Render deploy status: $DEPLOY_STATUS" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for Render deploy $DEPLOY_ID" >&2
          exit 1

      - name: Wait for deployed service
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          : "${RENDER_BASE_URL:?GitHub secret RENDER_BASE_URL is required}"
          BASE_URL="${RENDER_BASE_URL%/}"
          for attempt in $(seq 1 60); do
            if curl --fail --show-error --silent "$BASE_URL/health"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  api_tests:
    name: Newman and autograding
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Postman environment
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: |
          : "${RENDER_BASE_URL:?GitHub secret RENDER_BASE_URL is required}"
          BASE_URL="${RENDER_BASE_URL%/}"
          jq --arg url "$BASE_URL" \
            '(.values[] | select(.key == "baseUrl") | .value) = $url' \
            'postman/[inst][heroku] Lab1.postman_environment.json' > /tmp/render-postman-environment.json
          mv /tmp/render-postman-environment.json 'postman/[inst][heroku] Lab1.postman_environment.json'

      - name: Run API Tests
        run: npx --yes newman@6.2.2 run 'postman/[inst] Lab1.postman_collection.json' -e 'postman/[inst][heroku] Lab1.postman_environment.json' --delay-request 100

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true
